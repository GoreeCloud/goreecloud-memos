name: GoreeCloud Container

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/goreecloud-container.yml"
      - "cmd/**"
      - "deploy/goreecloud/**"
      - "go.mod"
      - "go.sum"
      - "internal/**"
      - "proto/**"
      - "scripts/**"
      - "server/**"
      - "store/**"
      - "web/**"
  workflow_dispatch:
  push:
    branches:
      - "release/goreecloud-v*"
    tags:
      - "goreecloud-v*"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"
  PNPM_VERSION: "11.0.1"
  IMAGE_NAME: ghcr.io/goreecloud/memos

jobs:
  validate:
    name: Build and validate GoreeCloud Memos image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Run Stable-release frontend quality gate
        if: startsWith(github.ref, 'refs/tags/goreecloud-v') || startsWith(github.ref, 'refs/heads/release/goreecloud-v')
        working-directory: web
        run: |
          pnpm lint
          pnpm test

      - name: Build frontend release assets
        working-directory: web
        run: pnpm release

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build validation image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./scripts/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: goreecloud-memos:ci
          build-args: |
            VERSION=goreecloud-ci
            COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=goreecloud-container-amd64
          cache-to: type=gha,mode=max,scope=goreecloud-container-amd64

      - name: Prepare isolated Compose validation paths
        run: |
          sudo install -d -o 10001 -g 10001 -m 0770 /tmp/goreecloud-memos-data
          sudo install -d -o 10001 -g 10001 -m 0750 /tmp/goreecloud-memos-config
          sudo cp deploy/goreecloud/memos-instance-setting-general.json.example \
            /tmp/goreecloud-memos-config/memos-instance-setting-general.json
          sudo chown 10001:10001 /tmp/goreecloud-memos-config/memos-instance-setting-general.json
          sudo chmod 0640 /tmp/goreecloud-memos-config/memos-instance-setting-general.json
          docker network create proxy

      - name: Validate Compose rendering
        env:
          GOREECLOUD_MEMOS_IMAGE: goreecloud-memos:ci
          GOREECLOUD_MEMOS_DATA_PATH: /tmp/goreecloud-memos-data
          GOREECLOUD_MEMOS_CONFIG_PATH: /tmp/goreecloud-memos-config
          GOREECLOUD_PROXY_NETWORK: proxy
          GOREECLOUD_MEMOS_TZ: America/Chicago
        run: docker compose -f deploy/goreecloud/compose.yaml config

      - name: Start Compose validation instance
        env:
          GOREECLOUD_MEMOS_IMAGE: goreecloud-memos:ci
          GOREECLOUD_MEMOS_DATA_PATH: /tmp/goreecloud-memos-data
          GOREECLOUD_MEMOS_CONFIG_PATH: /tmp/goreecloud-memos-config
          GOREECLOUD_PROXY_NETWORK: proxy
          GOREECLOUD_MEMOS_TZ: America/Chicago
        run: docker compose -f deploy/goreecloud/compose.yaml up -d

      - name: Wait for health check
        run: |
          for attempt in $(seq 1 30); do
            status="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' goreecloud-memos)"
            if [ "$status" = "healthy" ]; then
              docker exec goreecloud-memos wget -q -O - http://127.0.0.1:5230/healthz | grep -F "Service ready."
              exit 0
            fi
            if [ "$status" = "unhealthy" ]; then
              docker logs goreecloud-memos
              exit 1
            fi
            sleep 2
          done
          docker logs goreecloud-memos
          echo "Timed out waiting for GoreeCloud Memos health check" >&2
          exit 1

      - name: Validate authenticated restart persistence
        run: sh scripts/goreecloud-memos-ci-smoke.sh

      - name: Validate GoreeCloud state restart persistence
        run: sh scripts/goreecloud-memos-state-persistence-smoke.sh

      - name: Show validation logs
        if: always()
        run: docker logs goreecloud-memos || true

      - name: Stop validation instance
        if: always()
        env:
          GOREECLOUD_MEMOS_IMAGE: goreecloud-memos:ci
          GOREECLOUD_MEMOS_DATA_PATH: /tmp/goreecloud-memos-data
          GOREECLOUD_MEMOS_CONFIG_PATH: /tmp/goreecloud-memos-config
          GOREECLOUD_PROXY_NETWORK: proxy
          GOREECLOUD_MEMOS_TZ: America/Chicago
        run: docker compose -f deploy/goreecloud/compose.yaml down || true

  tagged-upgrade-gate:
    name: Validate Stable release upgrade path
    if: startsWith(github.ref, 'refs/tags/goreecloud-v') || startsWith(github.ref, 'refs/heads/release/goreecloud-v')
    uses: ./.github/workflows/upgrade-smoke.yml

  publish:
    name: Publish validated GoreeCloud Stable image
    if: startsWith(github.ref, 'refs/tags/goreecloud-v') || startsWith(github.ref, 'refs/heads/release/goreecloud-v')
    needs:
      - validate
      - tagged-upgrade-gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_digest: ${{ steps.publish.outputs.digest }}
      release_version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Resolve Stable release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/goreecloud-v* ]]; then
            version="$GITHUB_REF_NAME"
          elif [[ "$GITHUB_REF" == refs/heads/release/goreecloud-v* ]]; then
            version="${GITHUB_REF_NAME#release/}"
          else
            echo "Unsupported release ref: $GITHUB_REF" >&2
            exit 1
          fi

          if [[ ! "$version" =~ ^goreecloud-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid GoreeCloud Stable version: $version" >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Build frontend release assets
        working-directory: web
        run: pnpm release

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and publish exact Stable version
        id: publish
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./scripts/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=goreecloud-release
          cache-to: type=gha,mode=max,scope=goreecloud-release

      - name: Record immutable published image reference
        env:
          IMAGE_DIGEST: ${{ steps.publish.outputs.digest }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          test -n "$IMAGE_DIGEST"
          {
            echo "## GoreeCloud Memos published image"
            echo
            echo "- Tag: \`${IMAGE_NAME}:${RELEASE_VERSION}\`"
            echo "- Digest: \`${IMAGE_DIGEST}\`"
            echo "- Immutable reference: \`${IMAGE_NAME}:${RELEASE_VERSION}@${IMAGE_DIGEST}\`"
            echo "- Source commit: \`${GITHUB_SHA}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  promote-tag:
    name: Promote validated main to Stable tag
    if: startsWith(github.ref, 'refs/heads/release/goreecloud-v')
    needs:
      - publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout release source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify release source is exact current main
        env:
          RELEASE_VERSION: ${{ needs.publish.outputs.release_version }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --tags --force
          current_sha="$(git rev-parse HEAD)"
          main_sha="$(git rev-parse origin/main)"

          if [[ "$current_sha" != "$main_sha" ]]; then
            echo "Release ref $current_sha does not match current main $main_sha" >&2
            exit 1
          fi

          expected_version="${GITHUB_REF_NAME#release/}"
          if [[ "$expected_version" != "$RELEASE_VERSION" ]]; then
            echo "Release branch/version mismatch: $expected_version != $RELEASE_VERSION" >&2
            exit 1
          fi

          if git rev-parse "refs/tags/$RELEASE_VERSION" >/dev/null 2>&1; then
            echo "Stable tag already exists: $RELEASE_VERSION" >&2
            exit 1
          fi

      - name: Create annotated Stable tag
        env:
          IMAGE_DIGEST: ${{ needs.publish.outputs.image_digest }}
          RELEASE_VERSION: ${{ needs.publish.outputs.release_version }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$IMAGE_DIGEST"
          git config user.name "GoreeCloud Release Automation"
          git config user.email "295260680+GoreeCloud@users.noreply.github.com"
          git tag -a "$RELEASE_VERSION" "$GITHUB_SHA" \
            -m "GoreeCloud Memos ${RELEASE_VERSION#goreecloud-} Stable" \
            -m "Source: $GITHUB_SHA" \
            -m "Image: ${IMAGE_NAME}:${RELEASE_VERSION}@${IMAGE_DIGEST}"
          git push origin "refs/tags/$RELEASE_VERSION"

      - name: Record Stable promotion
        env:
          IMAGE_DIGEST: ${{ needs.publish.outputs.image_digest }}
          RELEASE_VERSION: ${{ needs.publish.outputs.release_version }}
        run: |
          {
            echo "## GoreeCloud Memos Stable promotion"
            echo
            echo "- Stable tag: \`${RELEASE_VERSION}\`"
            echo "- Source commit: \`${GITHUB_SHA}\`"
            echo "- Immutable image: \`${IMAGE_NAME}:${RELEASE_VERSION}@${IMAGE_DIGEST}\`"
          } >> "$GITHUB_STEP_SUMMARY"
