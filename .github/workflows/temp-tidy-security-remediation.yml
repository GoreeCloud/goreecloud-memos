name: Temporary Go Module Tidy

on:
  push:
    branches:
      - agent/remediate-memos-security-advisories

permissions:
  contents: write

jobs:
  tidy:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@v4
        with:
          ref: agent/remediate-memos-security-advisories
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Tidy Go modules
        run: go mod tidy

      - name: Commit generated module metadata
        shell: bash
        run: |
          if git diff --quiet -- go.mod go.sum; then
            echo "Go module metadata is already tidy."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add go.mod go.sum
          git commit -m "Tidy Go modules after security updates"
          git push origin HEAD:agent/remediate-memos-security-advisories
