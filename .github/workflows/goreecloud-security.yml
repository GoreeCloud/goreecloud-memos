name: GoreeCloud Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - "web/**"
      - "server/**"
      - "internal/**"
      - "cmd/**"
      - "proto/**"
      - "go.mod"
      - "go.sum"
      - "Dockerfile"
      - ".github/workflows/**"
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.26.2"
  NODE_VERSION: "24"
  PNPM_VERSION: "11.0.1"
  GOVULNCHECK_VERSION: "v1.6.0"
  TRIVY_VERSION: "v0.73.0"

jobs:
  frontend-advisories:
    name: Frontend production advisories
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Audit production dependencies
        working-directory: web
        run: pnpm audit --prod --audit-level high

  go-vulnerability-analysis:
    name: Go reachable vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum

      - name: Install pinned govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@${{ env.GOVULNCHECK_VERSION }}

      - name: Scan reachable Go vulnerabilities
        run: govulncheck ./...

  repository-security-scan:
    name: Repository vulnerability and configuration scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pinned Trivy
        uses: aquasecurity/setup-trivy@e07451d2e059ed86c2870430ea286b3a9e0bf241
        with:
          version: ${{ env.TRIVY_VERSION }}
          cache: true

      - name: Generate CycloneDX SBOM
        run: trivy fs --format cyclonedx --output goreecloud-memos.cdx.json .

      - name: Scan HIGH and CRITICAL security findings
        run: trivy fs --scanners vuln,secret,misconfig --severity HIGH,CRITICAL --exit-code 1 --no-progress .

      - name: Upload GoreeCloud Memos SBOM
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: goreecloud-memos-cyclonedx-sbom
          path: goreecloud-memos.cdx.json
          if-no-files-found: error
          retention-days: 14
