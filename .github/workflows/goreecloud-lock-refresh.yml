name: GoreeCloud Lock Refresh

on:
  pull_request:
    branches: [main]
    paths:
      - "go.mod"
      - "go.sum"
      - "store/**"
      - "web/package.json"
      - "web/pnpm-lock.yaml"
      - ".github/workflows/goreecloud-lock-refresh.yml"

permissions:
  contents: write

jobs:
  refresh-locks:
    name: Generate and apply dependency lockfiles
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Verify libpq source removal
        run: |
          if grep -R --line-number --include='*.go' 'github.com/lib/pq' .; then
            echo "lib/pq source imports remain; refusing lock refresh." >&2
            exit 1
          fi
          echo "No lib/pq source imports remain."

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: "11.0.1"

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Refresh pnpm lockfile
        working-directory: web
        run: pnpm install --lockfile-only --no-frozen-lockfile

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.6"
          cache: true
          cache-dependency-path: go.sum

      - name: Refresh Go module metadata
        run: go mod tidy

      - name: Verify regenerated manifests
        run: |
          ! grep -q 'github.com/lib/pq' go.mod
          grep -q 'github.com/jackc/pgx/v5 v5.10.0' go.mod
          grep -q 'react-router-dom@7.18.2' web/pnpm-lock.yaml
          grep -q 'react-router@7.18.2' web/pnpm-lock.yaml
          grep -q 'vite@8.0.16' web/pnpm-lock.yaml
          grep -q 'nanoid@3.3.18' web/pnpm-lock.yaml
          grep -Eq 'postcss@8\.5\.(1[89]|[2-9][0-9])' web/pnpm-lock.yaml

      - name: Commit regenerated dependency metadata
        run: |
          if git diff --quiet -- go.mod go.sum web/package.json web/pnpm-lock.yaml; then
            echo "Dependency metadata is already current."
            exit 0
          fi
          git config user.name "GoreeCloud"
          git config user.email "295260680+GoreeCloud@users.noreply.github.com"
          git add go.mod go.sum web/package.json web/pnpm-lock.yaml
          git commit -m "Refresh patched dependency metadata"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
