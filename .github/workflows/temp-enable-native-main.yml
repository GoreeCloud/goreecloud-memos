name: Temporary Enable Native Android Main Trigger

on:
  push:
    branches:
      - agent/native-android-main-acceptance

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/native-android-main-acceptance
          fetch-depth: 0
      - name: Route native Android authoritative push validation to main
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/native-android.yml')
          text = path.read_text()
          old = '''  push:\n    branches:\n      - "agent/native-android-home-capture"\n'''
          new = '''  push:\n    branches:\n      - "main"\n'''
          if text.count(old) != 1:
              raise SystemExit('expected legacy feature-branch push trigger exactly once')
          path.write_text(text.replace(old, new, 1))
          PY
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/native-android.yml
          git commit -m "Validate native Android artifacts on main pushes"
          git push origin HEAD:agent/native-android-main-acceptance
