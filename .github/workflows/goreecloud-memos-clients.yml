name: GoreeCloud Memos Clients

on:
  pull_request:
    paths:
      - "clients/goreecloud-memos/**"
      - "web/public/goreecloud-memos.svg"
      - "web/public/favicon-32x32.png"
      - "web/public/apple-touch-icon.png"
      - "web/public/android-chrome-192x192.png"
      - "web/public/android-chrome-512x512.png"
      - ".github/workflows/goreecloud-memos-clients.yml"
  push:
    branches:
      - main
    paths:
      - "clients/goreecloud-memos/**"
      - "web/public/goreecloud-memos.svg"
      - "web/public/favicon-32x32.png"
      - "web/public/apple-touch-icon.png"
      - "web/public/android-chrome-192x192.png"
      - "web/public/android-chrome-512x512.png"
      - ".github/workflows/goreecloud-memos-clients.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TAURI_CLI_VERSION: "2.11.4"
  NODE_VERSION: "24"
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Linux AppImage and Debian package
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Tauri Linux prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pinned Tauri CLI
        run: npm install --global "@tauri-apps/cli@${TAURI_CLI_VERSION}"

      - name: Generate native icon set from canonical Memos icon
        working-directory: clients/goreecloud-memos
        run: tauri icon ../../web/public/goreecloud-memos.svg

      - name: Verify Linux icon generation
        shell: bash
        run: |
          set -euo pipefail
          for icon in \
            clients/goreecloud-memos/src-tauri/icons/32x32.png \
            clients/goreecloud-memos/src-tauri/icons/128x128.png \
            clients/goreecloud-memos/src-tauri/icons/128x128@2x.png \
            clients/goreecloud-memos/src-tauri/icons/icon.png; do
            test -s "$icon"
          done
          sha256sum web/public/goreecloud-memos.svg > clients/goreecloud-memos/goreecloud-memos-canonical-icon.sha256

      - name: Run client unit tests
        run: cargo test --manifest-path clients/goreecloud-memos/src-tauri/Cargo.toml

      - name: Build Linux bundles
        working-directory: clients/goreecloud-memos
        run: tauri build --bundles appimage,deb

      - name: Generate Linux package checksums
        shell: bash
        run: |
          set -euo pipefail
          find \
            clients/goreecloud-memos/src-tauri/target/release/bundle/appimage \
            clients/goreecloud-memos/src-tauri/target/release/bundle/deb \
            -type f \( -name '*.AppImage' -o -name '*.deb' \) -print0 \
            | sort -z \
            | xargs -0 -r sha256sum \
            > clients/goreecloud-memos/goreecloud-memos-linux-x86_64.sha256
          test -s clients/goreecloud-memos/goreecloud-memos-linux-x86_64.sha256

      - name: Upload Linux client artifacts
        uses: actions/upload-artifact@v6
        with:
          name: goreecloud-memos-linux-x86_64
          if-no-files-found: error
          path: |
            clients/goreecloud-memos/src-tauri/target/release/bundle/appimage/*.AppImage
            clients/goreecloud-memos/src-tauri/target/release/bundle/deb/*.deb
            clients/goreecloud-memos/goreecloud-memos-linux-x86_64.sha256
            clients/goreecloud-memos/goreecloud-memos-canonical-icon.sha256

  android:
    name: Android ARM64 debug APK
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Select installed Android NDK
        shell: bash
        run: |
          NDK_DIR="${ANDROID_NDK_LATEST_HOME:-}"
          if [ -z "$NDK_DIR" ] && [ -d "$ANDROID_HOME/ndk" ]; then
            NDK_DIR="$(find "$ANDROID_HOME/ndk" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          fi
          if [ -z "$NDK_DIR" ]; then
            echo "No Android NDK installation was found." >&2
            exit 1
          fi
          echo "NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"

      - name: Setup Rust Android target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install pinned Rust-native Tauri CLI
        run: cargo install tauri-cli --version "${TAURI_CLI_VERSION}" --locked

      - name: Initialize generated Android project
        working-directory: clients/goreecloud-memos
        run: cargo tauri android init --ci --skip-targets-install

      - name: Generate Android launcher icons from canonical Memos icon
        working-directory: clients/goreecloud-memos
        run: cargo tauri icon ../../web/public/goreecloud-memos.svg

      - name: Verify Android launcher icon generation
        shell: bash
        run: |
          set -euo pipefail
          RESOURCE_ROOT="clients/goreecloud-memos/src-tauri/gen/android/app/src/main/res"
          test -d "$RESOURCE_ROOT"
          ICON_COUNT="$(find "$RESOURCE_ROOT" -type f \( -name 'ic_launcher*.png' -o -name 'ic_launcher*.xml' \) | wc -l)"
          test "$ICON_COUNT" -ge 3
          sha256sum web/public/goreecloud-memos.svg > clients/goreecloud-memos/goreecloud-memos-canonical-icon.sha256

      - name: Build installable ARM64 debug APK
        working-directory: clients/goreecloud-memos
        run: cargo tauri android build --debug --apk --target aarch64

      - name: Generate Android package checksum
        shell: bash
        run: |
          set -euo pipefail
          find clients/goreecloud-memos/src-tauri/gen/android/app/build/outputs/apk \
            -type f -name '*.apk' -print0 \
            | sort -z \
            | xargs -0 -r sha256sum \
            > clients/goreecloud-memos/goreecloud-memos-android-arm64-debug.sha256
          test -s clients/goreecloud-memos/goreecloud-memos-android-arm64-debug.sha256

      - name: Upload Android APK
        uses: actions/upload-artifact@v6
        with:
          name: goreecloud-memos-android-arm64-debug
          if-no-files-found: error
          path: |
            clients/goreecloud-memos/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
            clients/goreecloud-memos/goreecloud-memos-android-arm64-debug.sha256
            clients/goreecloud-memos/goreecloud-memos-canonical-icon.sha256
