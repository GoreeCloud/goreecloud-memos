name: GoreeCloud Deployment Tooling

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/goreecloud-deployment-tooling.yml"
      - "deploy/goreecloud/**"
      - "docs/goreecloud/backup-live-preflight.md"
      - "docs/goreecloud/backup-restore-validation.md"
      - "docs/goreecloud/monitoring-readiness.md"
      - "scripts/goreecloud-memos-deployment-preflight.sh"
      - "scripts/goreecloud-memos-deployment-preflight-test.sh"
      - "scripts/goreecloud-memos-readiness-docs-test.sh"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate production deployment tooling
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Validate shell syntax
        run: |
          sh -n scripts/goreecloud-memos-deployment-preflight.sh
          sh -n scripts/goreecloud-memos-deployment-preflight-test.sh
          sh -n scripts/goreecloud-memos-readiness-docs-test.sh

      - name: Validate private DNS and HTTPS preflight behavior
        run: sh scripts/goreecloud-memos-deployment-preflight-test.sh

      - name: Validate backup and monitoring readiness records
        run: sh scripts/goreecloud-memos-readiness-docs-test.sh
