name: Native Memos Android

on:
  pull_request:
    paths:
      - "native/android/**"
      - "native/platform/integrations.json"
      - "native/scripts/validate_platform_integrations.py"
      - "docs/development/native-android-home-capture.md"
      - "goreecloud.platform.yaml"
      - ".github/workflows/native-android.yml"
  push:
    branches:
      - "agent/native-android-home-capture"
    paths:
      - "native/android/**"
      - "native/platform/integrations.json"
      - "native/scripts/validate_platform_integrations.py"
      - "docs/development/native-android-home-capture.md"
      - "goreecloud.platform.yaml"
      - ".github/workflows/native-android.yml"

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: native/android
    steps:
      - name: Check out exact candidate revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Validate native Android boundary
        run: python3 scripts/check_native_android.py
      - name: Validate platform integration manifest
        working-directory: .
        run: python3 native/scripts/validate_platform_integrations.py
      - name: Lint, test, and build native Android Development APK
        run: gradle --no-daemon :app:lintDebug :app:testDebugUnitTest :app:assembleDebug --stacktrace
