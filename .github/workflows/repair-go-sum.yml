name: Repair Go checksums

on:
  push:
    branches:
      - agent/memos-glaze-ui-stabilization

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.6'
          cache: false

      - name: Regenerate go.sum
        shell: bash
        run: |
          rm -f go.sum
          go mod tidy -go=1.26.6
          git diff --check

      - name: Commit generated lockfile
        shell: bash
        run: |
          if git diff --quiet -- go.sum; then
            echo 'go.sum is already canonical.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add go.sum
          git commit -m 'Regenerate Go dependency checksums'
          git push origin HEAD:${{ github.ref_name }}
