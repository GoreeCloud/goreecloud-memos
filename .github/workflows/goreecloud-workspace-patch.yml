name: GoreeCloud workspace patch

on:
  push:
    branches:
      - feature/goreecloud-foundation

permissions:
  contents: write

jobs:
  apply:
    if: contains(github.event.head_commit.message, '[workspace-patch]')
    runs-on: ubuntu-latest
    steps:
      - name: Check out GoreeCloud branch
        uses: actions/checkout@v4
        with:
          ref: feature/goreecloud-foundation
          fetch-depth: 0

      - name: Apply GoreeCloud Notes workspace changes
        shell: python
        run: |
          from pathlib import Path

          def replace_exact(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              if old not in text:
                  raise SystemExit(f"Expected source block not found in {path}")
              file.write_text(text.replace(old, new, 1))

          replace_exact(
              "web/src/components/AppSidebar/AppSidebar.tsx",
              '''  const scopeItems: Array<{ id: MemoScope; label: string; icon: LucideIcon }> = [
            { id: "home", label: t("common.home"), icon: HouseIcon },
            { id: "explore", label: t("common.explore"), icon: EarthIcon },
            { id: "archived", label: t("common.archived"), icon: ArchiveIcon },
          ];
          const activeScopeItem = scopeItems.find((item) => item.id === resolvedScope) ?? scopeItems[0];''',
              '''  const allScopeItems: Array<{ id: MemoScope; label: string; icon: LucideIcon }> = [
            { id: "home", label: t("common.home"), icon: HouseIcon },
            { id: "explore", label: t("common.explore"), icon: EarthIcon },
            { id: "archived", label: t("common.archived"), icon: ArchiveIcon },
          ];
          // GoreeCloud Notes is a private notes workspace. Keep the upstream Explore
          // route available for compatibility and direct links without advertising it
          // in the normal signed-in scope switcher.
          const scopeItems = currentUser ? allScopeItems.filter((item) => item.id !== "explore") : allScopeItems;
          const activeScopeItem = allScopeItems.find((item) => item.id === resolvedScope) ?? allScopeItems[0];''',
          )

          replace_exact(
              "web/src/components/MemoEditor/index.tsx",
              'import { AudioRecorderPanel, EditorContent, EditorMetadata, FocusModeOverlay, TimestampPopover } from "./components";',
              'import { AudioRecorderPanel, EditorContent, EditorMetadata, FocusModeOverlay, NoteTitleField, TimestampPopover } from "./components";',
          )

          replace_exact(
              "web/src/components/MemoEditor/index.tsx",
              '''        {/* Editor content grows to fill available space in focus mode */}
                <EditorContent ref={editorRef} placeholder={placeholder} onSubmit={handleSave} onFiles={handleInsertImages} />''',
              '''        {/* A top-level note title maps to the leading Markdown H1. Replies keep
                    the upstream single-document editor because they do not need titles. */}
                {!parentMemoName && <NoteTitleField onEnter={() => editorRef.current?.focus()} />}

                {/* Editor content grows to fill available space in focus mode. */}
                <EditorContent
                  ref={editorRef}
                  placeholder={placeholder}
                  separateTitle={!parentMemoName}
                  onSubmit={handleSave}
                  onFiles={handleInsertImages}
                />''',
          )

          replace_exact(
              "web/src/components/MemoEditor/index.tsx",
              '"group relative w-full flex flex-col justify-between items-start bg-card px-4 pt-3 pb-1 rounded-lg border border-border gap-2",',
              '"group relative w-full flex flex-col justify-between items-start bg-card px-4 pt-3 pb-1 rounded-xl border border-border gap-2",',
          )

      - name: Commit workspace changes
        run: |
          git config user.name "GoreeCloud"
          git config user.email "295260680+GoreeCloud@users.noreply.github.com"
          git add web/src/components/AppSidebar/AppSidebar.tsx web/src/components/MemoEditor/index.tsx
          git diff --cached --check
          git commit -m "feat(goreecloud): simplify navigation and polish note editing"
          git push origin HEAD:feature/goreecloud-foundation
