# yamllint disable rule:line-length
name: Platform Contract

"on":
  pull_request:
    paths:
      - goreecloud.platform.yaml
      - .github/workflows/platform-contract.yml
  push:
    branches:
      - main
    paths:
      - goreecloud.platform.yaml
      - .github/workflows/platform-contract.yml
  workflow_dispatch:

permissions:
  contents: read

# Accepted Platform Contract 0.4 validates the authoritative nine-system model.
# This gate validates declaration structure and computed nonconformance only;
# it does not manufacture runtime integration, application acceptance, or Stable status.
jobs:
  validate:
    uses: GoreeCloud/GoreeCloud/.github/workflows/reusable-platform-manifest.yml@6cb150d512647a0401b4da9e4741d7591693dee0
    with:
      manifest-path: goreecloud.platform.yaml
