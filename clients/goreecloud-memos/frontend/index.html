<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#faf9f5" />
    <link rel="preconnect" href="https://memos.goreecloud.com" crossorigin />
    <title>GoreeCloud Memos</title>
    <style>
      :root {
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color-scheme: light dark;
        background: #faf9f5;
        color: #24231f;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding:
          max(1.5rem, env(safe-area-inset-top))
          max(1.25rem, env(safe-area-inset-right))
          max(1.5rem, env(safe-area-inset-bottom))
          max(1.25rem, env(safe-area-inset-left));
        background:
          radial-gradient(circle at 20% 10%, rgb(48 117 255 / 10%), transparent 36%),
          #faf9f5;
      }

      main {
        width: min(100%, 24rem);
        display: flex;
        align-items: center;
        gap: 1rem;
        padding: 1rem 1.1rem;
        border: 1px solid rgb(36 35 31 / 12%);
        border-radius: 1.35rem;
        background: rgb(255 255 255 / 82%);
        box-shadow: 0 18px 48px rgb(38 46 62 / 12%);
        backdrop-filter: blur(18px);
      }

      .mark {
        width: 3.5rem;
        height: 3.5rem;
        flex: 0 0 auto;
        display: block;
        border-radius: 1rem;
      }

      .title {
        margin: 0;
        font-size: 1.18rem;
        line-height: 1.2;
        font-weight: 700;
        letter-spacing: -0.025em;
      }

      .status {
        margin: 0.25rem 0 0;
        font-size: 1rem;
        line-height: 1.35;
        color: rgb(36 35 31 / 66%);
      }

      @media (prefers-color-scheme: dark) {
        :root {
          background: #151515;
          color: #f3f2ed;
        }

        body {
          background:
            radial-gradient(circle at 20% 10%, rgb(86 145 255 / 14%), transparent 36%),
            #151515;
        }

        main {
          border-color: rgb(255 255 255 / 12%);
          background: rgb(30 30 30 / 88%);
          box-shadow: 0 18px 48px rgb(0 0 0 / 28%);
        }

        .status {
          color: rgb(243 242 237 / 68%);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        * {
          scroll-behavior: auto !important;
        }
      }
    </style>
  </head>
  <body>
    <main role="status" aria-live="polite" aria-label="Opening GoreeCloud Memos">
      <img class="mark" src="./goreecloud-memos.svg" alt="" aria-hidden="true" />
      <div>
        <p class="title">GoreeCloud Memos</p>
        <p class="status">Opening your memos…</p>
      </div>
    </main>
    <script src="./launch.js"></script>
  </body>
</html>
