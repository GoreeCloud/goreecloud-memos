schema_version: '0.4'

component:
  type: application
  id: goreecloud-memos
  product_name: GoreeCloud Memos
  repository: GoreeCloud/goreecloud-memos

lifecycle: development
version: '0.0.13-dev.0'

supported_platforms:
  - web
  - android

api:
  versions: []
  endpoints: []

platform_systems:
  manager:
    result: applicable-blocked
    version: null
    evidence: [README.md, FEATURE-ROADMAP.md]
    notes: Administration and lifecycle integration are planned but not implemented.
  privacy_shield:
    result: applicable-blocked
    version: null
    evidence: ['PRIVACY POLICY.md']
    notes: Formal Privacy Shield integration and acceptance are not implemented.
  wardveil_security:
    result: applicable-blocked
    version: null
    evidence: [SECURITY.md]
    notes: Wardveil runtime integration and acceptance are not implemented.
  everkeep:
    result: applicable-blocked
    version: null
    evidence: [FEATURE-ROADMAP.md, USER-MANUAL.md]
    notes: Portability, backup, recovery, and continuity integration remain future work.
  glaze_ui:
    result: applicable-migration-required
    version: null
    evidence: [BRANDING.md, web/styles.css, android/app/src/main/java/com/goreecloud/memos/MemosGlazeStyle.kt]
    notes: Web and Android Development presentation scaffolds retain Glaze UI 1.5.1-era semantics. Current shared Stable authority is Glaze UI 1.6.0, so deliberate V1.6 migration plus repository-local rendered, accessibility, representative-device/form-factor, performance, rollback, and production visual acceptance remain required.
  mesh:
    result: applicable-blocked
    version: null
    evidence: [FEATURE-ROADMAP.md]
    notes: Capability discovery and coordination are planned but not implemented.
    capabilities: []
    dependencies: []
    published_events: []
    consumed_events: []
  identity:
    result: applicable-blocked
    version: null
    evidence: [SECURITY.md]
    notes: No account or authentication layer is implemented.
  policy:
    result: applicable-blocked
    version: null
    evidence: [FEATURE-ROADMAP.md]
    notes: GoreeCloud Policy integration and decision evidence are not implemented.
  observability:
    result: applicable-blocked
    version: null
    evidence: [FEATURE-ROADMAP.md]
    notes: Production health, telemetry, diagnostics, and Observability integration are not implemented.
health:
  health_endpoint: null
  readiness_endpoint: null

continuity:
  backup:
    required: true
    requirements:
      - Define and implement backups for future authoritative server state and required local state.
  restore:
    required: true
    requirements:
      - Define and validate clean-target recovery before any production recovery claim.
  export:
    required: true
    requirements:
      - Implement documented user-owned portable export and round-trip validation.
  portability:
    required: true
    requirements:
      - Keep memo content and metadata reconstructable in documented open formats.

external_dependencies:
  - name: Browser IndexedDB
    purpose: Development-only local persistence for the first web quick-capture slice.
    required: true
    version_constraint: null

compatibility:
  platform_contract: '0.4'
  glaze_ui_required: '1.6.0'
  requires:
    - goreecloud-platform-contract==0.4
    - glaze-ui==1.6.0
  provides:
    - goreecloud-memos-local-capture-dev-v1
    - goreecloud-memos-android-local-capture-dev-v1

evidence:
  acceptance_tests: []
  release: []

conformance:
  status: nonconformant
  validated_at: null
  evidence:
    - README.md
    - FEATURES.md
    - SECURITY.md
    - 'PRIVACY POLICY.md'
    - goreecloud.platform.yaml
    - android/app/src/main/AndroidManifest.xml
    - android/app/src/main/java/com/goreecloud/memos/MainActivity.kt
  blockers:
    - No production server, account, synchronization, backup/recovery, or administration implementation exists.
    - All nine Integral Platform System runtime integrations and acceptance remain blocked or migration-required; GoreeCloud Policy and GoreeCloud Observability have been explicitly evaluated but are not implemented.
    - GoreeCloud Sync remains separately governed; shared synchronization is planned but not implemented or accepted.
    - Current shared Stable Glaze UI 1.6.0 is the required consumer baseline; Memos still carries 1.5.1-era presentation scaffolds and has not established V1.6 migration, conformance, or visual acceptance.
    - Native desktop is not implemented; the Android client is only a local Development foundation and lacks synchronization, account/Identity, attachment, reminder, share/widget, biometric-lock, platform-system acceptance, representative-device acceptance, production signing, and release qualification.
    - Production security, privacy, observability, recovery, and Stable qualification evidence do not exist.
