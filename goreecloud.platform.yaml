schema_version: '0.3'

component:
  type: application
  id: goreecloud-memos
  product_name: GoreeCloud Memos
  repository: GoreeCloud/goreecloud-memos

lifecycle: development
version: '0.0.10-dev.0'

supported_platforms:
  - web

api:
  versions: []
  endpoints: []

platform_systems:
  manager:
    result: applicable-blocked
    version: null
    evidence: [README.md, FEATURE-ROADMAP.md]
    notes: Administration and lifecycle integration are planned but not implemented.
  privacy_shield:
    result: applicable-blocked
    version: null
    evidence: ['PRIVACY POLICY.md']
    notes: Formal Privacy Shield integration and acceptance are not implemented.
  wardveil_security:
    result: applicable-blocked
    version: null
    evidence: [SECURITY.md]
    notes: Wardveil runtime integration and acceptance are not implemented.
  everkeep:
    result: applicable-blocked
    version: null
    evidence: [FEATURE-ROADMAP.md, USER-MANUAL.md]
    notes: Portability, backup, recovery, and continuity integration remain future work.
  glaze_ui:
    result: applicable-migration-required
    version: null
    evidence: [BRANDING.md, web/styles.css]
    notes: The development UI is an evolving scaffold; current Stable Glaze UI 1.5.1 consumer conformance and visual acceptance remain required.
  mesh:
    result: applicable-blocked
    version: null
    evidence: [FEATURE-ROADMAP.md]
    notes: Capability discovery and coordination are planned but not implemented.
    capabilities: []
    dependencies: []
    published_events: []
    consumed_events: []
  identity:
    result: applicable-blocked
    version: null
    evidence: [SECURITY.md]
    notes: No account or authentication layer is implemented.
  policy:
    result: applicable-blocked
    version: null
    evidence: [FEATURE-ROADMAP.md]
    notes: GoreeCloud Policy integration and decision evidence are not implemented.
  observability:
    result: applicable-blocked
    version: null
    evidence: [FEATURE-ROADMAP.md]
    notes: Production health, telemetry, diagnostics, and Observability integration are not implemented.
  sync:
    result: applicable-blocked
    version: null
    evidence: [FEATURE-ROADMAP.md]
    notes: Shared synchronization is separately planned and not implemented.

health:
  health_endpoint: null
  readiness_endpoint: null

continuity:
  backup:
    required: true
    requirements:
      - Define and implement backups for future authoritative server state and required local state.
  restore:
    required: true
    requirements:
      - Define and validate clean-target recovery before any production recovery claim.
  export:
    required: true
    requirements:
      - Implement documented user-owned portable export and round-trip validation.
  portability:
    required: true
    requirements:
      - Keep memo content and metadata reconstructable in documented open formats.

external_dependencies:
  - name: Browser IndexedDB
    purpose: Development-only local persistence for the first web quick-capture slice.
    required: true
    version_constraint: null

compatibility:
  platform_contract: '0.3'
  glaze_ui_required: '1.5.1'
  requires:
    - goreecloud-platform-contract==0.3
    - glaze-ui==1.5.1
  provides:
    - goreecloud-memos-local-capture-dev-v1

evidence:
  acceptance_tests:
    - tests/memo.test.mjs
    - tests/memo-service.test.mjs
    - tests/label.test.mjs
    - tests/label-presentation.test.mjs
    - tests/e2e/label-management.spec.mjs
  release: []

conformance:
  status: nonconformant
  validated_at: null
  evidence:
    - README.md
    - FEATURES.md
    - SECURITY.md
    - 'PRIVACY POLICY.md'
    - goreecloud.platform.yaml
  blockers:
    - No production server, account, synchronization, backup/recovery, or administration implementation exists.
    - Integral Platform System runtime integrations and acceptance are not established.
    - Current Stable Glaze UI 1.5.1 consumer conformance and visual acceptance are not established.
    - Native desktop and mobile clients are not implemented.
    - Production security, privacy, observability, recovery, and Stable qualification evidence do not exist.
