schema_version: "0.1"

component:
  type: application
  id: goreecloud-memos
  product_name: GoreeCloud Memos
  repository: GoreeCloud/goreecloud-memos

lifecycle: development
version: "0.1.0-dev"

supported_platforms:
  - server
  - android

api:
  versions: []
  endpoints: []

platform_systems:
  manager:
    status: planned
    version: null
    evidence:
      - native/README.md
    notes: The original native Memos rebuild is not registered through the accepted GoreeCloud platform visibility path and has no accepted Manager integration evidence.
  privacy_shield:
    status: planned
    version: null
    evidence:
      - native/internal/memo/portable_snapshot.go
      - native/internal/memo/portable_snapshot_inspection.go
      - native/android/README.md
      - docs/development/native-portable-snapshot.md
      - docs/development/native-portable-snapshot-inspection.md
    notes: The native foundation is owner-scoped, the portable snapshot omits source-owner identity, snapshot preflight returns aggregate counts only, and the Android Home/Capture foundation has no network or production-data authority, but accepted Privacy Shield integration and production privacy validation are not established.
  wardveil_security:
    status: planned
    version: null
    evidence:
      - native/internal/memo/file_repository.go
      - native/android/scripts/check_native_android.py
    notes: The durable Development repository has fail-closed path, mode, symlink, atomic-write, and owner-isolation safeguards and the Android source rejects WebView/network authority, but these source controls do not establish accepted Wardveil Security integration.
  everkeep:
    status: planned
    version: null
    evidence:
      - native/internal/memo/portable_snapshot.go
      - native/internal/memo/portable_snapshot_inspection.go
      - docs/development/native-portable-snapshot.md
      - docs/development/native-portable-snapshot-inspection.md
    notes: A versioned portable snapshot codec and privacy-minimized read-only preflight exist as Development portability foundations. The Android UI uses session-only in-memory state and does not provide repository restore, clean-target recovery, backup lineage, or accepted Everkeep integration.
  glaze_ui:
    status: partial
    version: "1.0.0"
    evidence:
      - native/platform/integrations.json
      - native/android/app/src/main/java/com/goreecloud/memos/MainActivity.kt
      - native/android/app/src/main/java/com/goreecloud/memos/home/HomeScreen.kt
      - native/android/app/src/main/java/com/goreecloud/memos/ui/theme/GlazeMetrics.kt
      - native/android/app/src/main/java/com/goreecloud/memos/ui/theme/GlazeTheme.kt
      - native/android/scripts/check_native_android.py
      - native/android/README.md
      - docs/development/native-android-home-capture.md
    notes: A Kotlin/Jetpack Compose Android Home/Capture foundation now maps the consumed GLAZE UI V1.0 geometry and Light/Dark foundation to native Android behavior at exact canonical source revision 70909bbdccad378fb7281ae1842e2f5beed64c38. Complete rendered, accessibility, semantic-state, motion, adaptive, representative-device, Human Visual Excellence, release, and production acceptance remain incomplete.
  mesh:
    status: planned
    version: null
    evidence:
      - native/platform/browser_capture_contract.json
    notes: A reviewed Browser capture contract exists, but endpoint, adapter, production readiness, canonical Mesh registration, capability publication, and runtime acceptance remain unestablished.
    capabilities: []
    dependencies: []
    published_events: []
    consumed_events: []
  identity:
    status: planned
    version: null
    evidence:
      - native/internal/memo/file_repository.go
    notes: Native memo operations are explicitly owner-scoped, but owner scoping is not GoreeCloud Identity. The Android foundation intentionally has no authenticated production data binding. Accepted authentication, session, and owner-binding integration are not implemented.

health:
  health_endpoint: null
  readiness_endpoint: null

continuity:
  backup:
    required: true
    requirements:
      - Preserve accepted production data during transition while defining the approved native Memos backup scope.
      - Establish accepted Everkeep-compatible backup scheduling, integrity, retention, privacy, credential recovery, and independent-copy evidence before native production use.
  restore:
    required: true
    requirements:
      - Implement an authorized clean-target native restore path with explicit GoreeCloud Identity owner binding, transactional persistence, conflict policy, failure handling, and auditability.
      - Keep snapshot decoding and inspection separate from repository overwrite until restore authority is explicitly implemented and accepted.
  export:
    required: true
    requirements:
      - Preserve goreecloud-memos-portable-snapshot/1 semantics for supported memo identity, content, labels, reminder, lifecycle, pinning, and timestamps.
      - Omit source-owner identity and require explicit target-owner materialization without treating the format as backup or restore.
  portability:
    required: true
    requirements:
      - Fail closed on unsupported format/schema versions, checksum mismatch, duplicate identifiers, invalid lifecycle/timestamps, malformed records, unknown fields, and trailing data.
      - Keep the aggregate snapshot-inspection projection content-minimized and read-only.
      - Validate user-facing export/import and clean-target reconstruction before product-wide portability is claimed.

external_dependencies:
  - name: Android platform
    purpose: Native Activity lifecycle, Jetpack Compose rendering, IME interaction, Back navigation, system bars, accessibility, and application execution environment.
    required: true

compatibility:
  requires:
    - goreecloud-platform-contract>=0.1
    - glaze-ui==1.0.0
    - android-api>=29
  provides:
    - goreecloud-memos-portable-snapshot/1

conformance:
  status: nonconformant
  validated_at: null
  evidence:
    - USER-MANUAL.md
    - native/README.md
    - native/platform/integrations.json
    - native/platform/browser_capture_contract.json
    - native/internal/memo/file_repository.go
    - native/internal/memo/portable_snapshot.go
    - native/internal/memo/portable_snapshot_inspection.go
    - native/android/README.md
    - native/android/app/src/main/java/com/goreecloud/memos/MainActivity.kt
    - native/android/app/src/main/java/com/goreecloud/memos/home/HomeScreen.kt
    - native/android/app/src/main/java/com/goreecloud/memos/ui/theme/GlazeMetrics.kt
    - native/android/scripts/check_native_android.py
    - docs/development/native-portable-snapshot.md
    - docs/development/native-portable-snapshot-inspection.md
    - docs/development/native-android-home-capture.md
  blockers:
    - The original native rebuild now has a source-level Kotlin/Jetpack Compose Android Home/Capture foundation, but no accepted GLAZE UI V1.0 rendered/accessibility/device/Human Visual Excellence/release acceptance.
    - The Android foundation is session-only and has no authorized production memo repository, API, synchronization, or migration binding.
    - GoreeCloud Identity authentication, session, and owner-binding integration are not established.
    - Wardveil Security integration and acceptance are not established.
    - Privacy Shield integration and acceptance are not established.
    - Everkeep integration plus accepted native backup, restore, and clean-target recovery are not established.
    - GoreeCloud Mesh registration, Browser capture endpoint/adapter readiness, capability publication, and runtime acceptance are not established.
    - Manager platform visibility and administrative integration acceptance are not established.
    - No native network API is claimed or accepted in this Development checkpoint.
    - The portable snapshot and aggregate preflight are bounded source-level portability evidence, not accepted backup, restore, or production export/import workflows.
    - Controlled migration from the retained accepted web/server runtime into the native rebuild is not implemented or approved.
    - Native deployment, protected Android release signing, representative-device production acceptance, release approval, and Stable qualification remain outstanding.
    - Platform Contract adoption and source CI do not by themselves authorize production or Stable qualification.
