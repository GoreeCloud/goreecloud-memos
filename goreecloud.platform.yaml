schema_version: "0.2"

component:
  type: application
  id: goreecloud-memos
  product_name: GoreeCloud Memos
  repository: GoreeCloud/goreecloud-memos

lifecycle: development
version: "0.1.0-dev"

supported_platforms:
  - server
  - android

api:
  versions: []
  endpoints: []

platform_systems:
  manager:
    result: applicable-blocked
    version: null
    evidence:
      - native/README.md
    notes: The original native Memos rebuild is not registered through the accepted GoreeCloud platform visibility path and has no accepted Manager integration evidence.
  privacy_shield:
    result: applicable-blocked
    version: null
    evidence:
      - native/internal/memo/portable_snapshot.go
      - native/internal/memo/portable_snapshot_inspection.go
      - native/android/README.md
      - docs/development/native-portable-snapshot.md
      - docs/development/native-portable-snapshot-inspection.md
    notes: Owner-scoped source controls, owner-omitting portability, aggregate-only preflight, and a network-free Android capture foundation reduce exposure, but accepted Privacy Shield integration and production privacy validation are not established.
  wardveil_security:
    result: applicable-blocked
    version: null
    evidence:
      - native/internal/memo/file_repository.go
      - native/android/scripts/check_native_android.py
    notes: Development source includes fail-closed repository safeguards and static Android network/WebView checks, but accepted Wardveil Security integration is not established.
  everkeep:
    result: applicable-blocked
    version: null
    evidence:
      - native/internal/memo/portable_snapshot.go
      - native/internal/memo/portable_snapshot_inspection.go
      - docs/development/native-portable-snapshot.md
      - docs/development/native-portable-snapshot-inspection.md
    notes: A versioned portable snapshot codec and read-only aggregate preflight exist, but authorized clean-target restore, recovery lineage, and accepted Everkeep integration are not established.
  glaze_ui:
    result: applicable-migration-required
    version: "1.0.0"
    evidence:
      - native/android/app/src/main/java/com/goreecloud/memos/MainActivity.kt
      - native/android/app/src/main/java/com/goreecloud/memos/home/HomeScreen.kt
      - native/android/app/src/main/java/com/goreecloud/memos/ui/theme/GlazeMetrics.kt
      - native/android/app/src/main/java/com/goreecloud/memos/ui/theme/GlazeTheme.kt
      - docs/development/native-android-home-capture.md
    notes: The current native Android foundation targets historical GLAZE UI V1.0. Migration and application-specific acceptance against current Stable GLAZE UI V1.1 / 1.1.0 remain required.
  mesh:
    result: applicable-blocked
    version: null
    evidence:
      - native/platform/browser_capture_contract.json
    notes: A reviewed Browser capture contract exists, but canonical Mesh registration, endpoint and adapter readiness, capability publication, and runtime acceptance are not established.
    capabilities: []
    dependencies: []
    published_events: []
    consumed_events: []
  identity:
    result: applicable-blocked
    version: null
    evidence:
      - native/internal/memo/file_repository.go
    notes: Native memo operations are owner-scoped, but accepted GoreeCloud Identity authentication, session, and owner binding are not established.

health:
  health_endpoint: null
  readiness_endpoint: null

continuity:
  backup:
    required: true
    requirements:
      - Preserve accepted production data during transition while defining the approved native Memos backup scope.
      - Establish accepted Everkeep-compatible backup scheduling, integrity, retention, privacy, credential recovery, and independent-copy evidence before native production use.
  restore:
    required: true
    requirements:
      - Implement an authorized clean-target native restore path with explicit GoreeCloud Identity owner binding, transactional persistence, conflict policy, failure handling, and auditability.
      - Keep snapshot decoding and inspection separate from repository overwrite until restore authority is explicitly implemented and accepted.
  export:
    required: true
    requirements:
      - Preserve goreecloud-memos-portable-snapshot/1 semantics for supported memo identity, content, labels, reminder, lifecycle, pinning, and timestamps.
      - Omit source-owner identity and require explicit target-owner materialization without treating the format as backup or restore.
  portability:
    required: true
    requirements:
      - Fail closed on unsupported format or schema versions, checksum mismatch, duplicate identifiers, invalid lifecycle or timestamps, malformed records, unknown fields, and trailing data.
      - Keep the aggregate snapshot-inspection projection content-minimized and read-only.
      - Validate user-facing export and import plus clean-target reconstruction before product-wide portability is claimed.

external_dependencies:
  - name: Android platform
    purpose: Native Activity lifecycle, Jetpack Compose rendering, system integration, accessibility, and application execution environment.
    required: true
    version_constraint: ">=29"

compatibility:
  platform_contract: "0.2"
  glaze_ui_required: "1.1.0"
  requires:
    - goreecloud-platform-contract==0.2
    - glaze-ui==1.1.0
    - android-api>=29
  provides:
    - goreecloud-memos-portable-snapshot/1

evidence:
  acceptance_tests: []
  release: []

conformance:
  status: nonconformant
  validated_at: null
  evidence:
    - USER-MANUAL.md
    - native/README.md
    - native/android/README.md
    - docs/development/native-portable-snapshot.md
    - docs/development/native-portable-snapshot-inspection.md
    - docs/development/native-android-home-capture.md
  blockers:
    - GLAZE UI V1.1 / 1.1.0 migration and application-specific rendered, accessibility, adaptive, representative-device, Human Visual Excellence, release, and production acceptance remain outstanding.
    - The Android foundation remains session-only and has no authorized production memo repository, API, synchronization, or migration binding.
    - GoreeCloud Identity authentication, session, and owner-binding integration are not established.
    - Wardveil Security integration and acceptance are not established.
    - Privacy Shield integration and acceptance are not established.
    - Everkeep integration plus accepted native backup, restore, and clean-target recovery are not established.
    - GoreeCloud Mesh registration, Browser capture endpoint and adapter readiness, capability publication, and runtime acceptance are not established.
    - Manager platform visibility and administrative integration acceptance are not established.
    - Controlled migration from the retained accepted web/server runtime into the native rebuild is not implemented or approved.
    - Native deployment, protected Android release signing, representative-device production acceptance, release approval, and Stable qualification remain outstanding.
